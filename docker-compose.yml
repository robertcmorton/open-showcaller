services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showcaller
      POSTGRES_PASSWORD: showcaller
      POSTGRES_DB: showcaller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcaller"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync:
    build:
      context: .
      dockerfile: apps/sync/Dockerfile
    environment:
      DATABASE_URL: postgres://showcaller:showcaller@postgres:5432/showcaller
      PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Point these at the host/domain browsers will reach the sync server on.
        NEXT_PUBLIC_SYNC_HTTP_URL: http://localhost:8787
        NEXT_PUBLIC_SYNC_WS_URL: ws://localhost:8787
        NEXT_PUBLIC_DOC_WS_URL: ws://localhost:8787/doc
    ports:
      - "3000:3000"
    depends_on:
      - sync

  # One-shot demo data: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: apps/sync/Dockerfile
    environment:
      DATABASE_URL: postgres://showcaller:showcaller@postgres:5432/showcaller
    command: ["pnpm", "--filter", "@open-showcaller/db", "seed"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgdata:
